<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Three floating shelves mounted on a wall</title>
  <rect width="400" height="300" fill="#EDE7DD"/>
  <rect y="262" width="400" height="38" fill="#B9A58A"/>
  <rect y="258" width="400" height="6" fill="#F4F1EC"/>
  <!-- shelves -->
  <g fill="#8A6A48">
    <rect x="120" y="78" width="160" height="12" rx="2"/>
    <rect x="120" y="140" width="160" height="12" rx="2"/>
    <rect x="120" y="202" width="160" height="12" rx="2"/>
  </g>
  <g fill="#000" opacity="0.08">
    <rect x="122" y="90" width="158" height="5"/>
    <rect x="122" y="152" width="158" height="5"/>
    <rect x="122" y="214" width="158" height="5"/>
  </g>
  <!-- books top shelf -->
  <rect x="132" y="44" width="10" height="34" fill="#1E40AF"/>
  <rect x="144" y="48" width="9" height="30" fill="#B45309"/>
  <rect x="155" y="40" width="11" height="38" fill="#475569"/>
  <rect x="168" y="50" width="8" height="28" fill="#047857"/>
  <!-- plant top shelf -->
  <path d="M248 78 h20 l-3 -18 h-14 z" fill="#C2410C"/>
  <path d="M258 60 c-10 -14 -16 -10 -18 -22 c10 2 16 8 18 18 c2 -12 8 -20 18 -22 c-2 12 -8 18 -18 26z" fill="#15803D"/>
  <!-- middle shelf -->
  <rect x="140" y="112" width="30" height="28" rx="3" fill="#F8FAFC" stroke="#94A3B8"/>
  <rect x="146" y="118" width="18" height="16" fill="#93C5FD"/>
  <rect x="210" y="118" width="54" height="10" fill="#334155"/>
  <rect x="214" y="128" width="50" height="12" fill="#64748B"/>
  <!-- bottom shelf -->
  <circle cx="160" cy="190" r="12" fill="#E2E8F0" stroke="#94A3B8"/>
  <rect x="226" y="170" width="9" height="32" fill="#7C3AED" opacity="0.7"/>
  <rect x="237" y="174" width="12" height="28" fill="#0F766E"/>
  <rect x="251" y="168" width="8" height="34" fill="#B91C1C" opacity="0.8"/>
  <text x="12" y="290" font-family="sans-serif" font-size="12" fill="#3F3A33">Photo 1 of 3 · placeholder image</text>
</svg>
