<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Clean floor under the shelves</title>
  <rect width="400" height="300" fill="#EDE7DD"/>
  <!-- bottom shelf edge at top -->
  <rect x="80" y="40" width="240" height="12" rx="2" fill="#8A6A48"/>
  <rect x="82" y="52" width="238" height="5" fill="#000" opacity="0.08"/>
  <!-- baseboard and floor -->
  <rect y="190" width="400" height="12" fill="#F4F1EC"/>
  <rect y="202" width="400" height="98" fill="#B9A58A"/>
  <g stroke="#A08C70" stroke-width="2">
    <line x1="0" y1="232" x2="400" y2="232"/>
    <line x1="0" y1="266" x2="400" y2="266"/>
    <line x1="120" y1="202" x2="120" y2="232"/>
    <line x1="280" y1="232" x2="280" y2="266"/>
    <line x1="60" y1="266" x2="60" y2="300"/>
  </g>
  <!-- sparkle marks to suggest clean -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="200" y1="236" x2="200" y2="252"/><line x1="192" y1="244" x2="208" y2="244"/>
    <line x1="300" y1="210" x2="300" y2="222"/><line x1="294" y1="216" x2="306" y2="216"/>
  </g>
  <text x="12" y="290" font-family="sans-serif" font-size="12" fill="#3F3A33">Photo 3 of 3 · placeholder image</text>
</svg>
